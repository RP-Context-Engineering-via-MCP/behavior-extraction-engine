# Loki minimal configuration for local / dev deployment.
# For production, switch storage_config to S3 / GCS and enable replication.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# How long to keep logs (adjust to your needs)
limits_config:
  retention_period: 30d        # 30 days of logs

# Schema — controls how Loki indexes log streams
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Ruler (alerting) — optional, leave disabled for now
ruler:
  alertmanager_url: http://localhost:9093

# Compactor handles retention enforcement
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h

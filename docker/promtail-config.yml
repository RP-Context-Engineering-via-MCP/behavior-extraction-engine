# Promtail configuration -- file-based log collection.
#
# WHY file-based instead of docker_sd_configs:
#   docker_sd_configs uses the Docker SDK internally (API v1.42) which is
#   incompatible with Docker Engine >= 25 (requires API v1.44+).
#   Reading log files directly from the host filesystem requires no Docker
#   API calls at all -- same result, zero version conflicts.
#
# HOW it works:
#   1. Tail every container log file under /var/lib/docker/containers/
#   2. Parse the outer Docker JSON wrapper to get the real log line
#   3. Parse our app's inner JSON log line to extract fields
#   4. Drop lines from containers that are NOT ours (empty service field
#      means it is Loki / Promtail / Grafana / some other container)
#   5. Promote level / service / env to Loki stream labels
#   6. Override the job label with the service name
#   7. Push to Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  - job_name: docker-containers

    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*.log

    pipeline_stages:

      # Stage 1: Parse the outer Docker JSON wrapper.
      # Every line in a Docker log file looks like:
      #   {"log":"<actual line>\n","stream":"stdout","time":"2026-..."}
      - json:
          expressions:
            output: log
            stream: stream

      # Stage 2: Parse our app's inner JSON log line.
      # Fields emitted by logging_config.py:
      #   timestamp, level, logger, message, service, env
      - json:
          source: output
          expressions:
            level: level
            logger: logger
            message: message
            service: service
            env: env

      # Stage 3: Drop lines where service is empty.
      # Containers like Loki/Promtail/Grafana write plain text, not our JSON,
      # so their service field will be empty after the parse above.
      - drop:
          source: service
          value: ""

      # Stage 4: Promote fields to Loki stream labels.
      # Labels are indexed -- keep cardinality low (no user IDs here).
      - labels:
          level:
          service:
          env:
          stream:

      # Stage 5: Override the job label to match the service name so queries
      # like {job="behavior-detection"} work as expected in Grafana.
      - labels:
          job: service

      # Stage 6: Use the timestamp from our app log, not Docker's wrapper.
      - timestamp:
          source: timestamp
          format: "2006-01-02T15:04:05"

      # Stage 7: Set the stored log line to our app's raw JSON.
      - output:
          source: output
